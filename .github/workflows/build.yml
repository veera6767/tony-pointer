name: Build and Package Pointer V

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit & Smoke Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pointer_v/requirements.txt
          pip install pytest ruff pyflakes

      - name: Gate 1a - Compile Python Bytecode
        run: |
          python -m compileall pointer_v

      - name: Gate 1b - Static Analysis (Ruff)
        run: |
          python -m ruff check pointer_v

      - name: Gate 1c - Run Pytest Suite
        run: |
          pytest tests -v

  build-web:
    name: Build Web Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run TypeScript Check
        run: |
          npm run lint

      - name: Build Web Studio Bundle
        run: |
          npm run build

  build-windows:
    name: Build Windows Executable & Installer
    needs: [test, build-web]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pointer_v/requirements.txt
          pip install pyinstaller pytest ruff

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Gate 2 - Build PyInstaller Onedir Bundle
        working-directory: pointer_v
        run: |
          pyinstaller --clean --noconfirm PointerV.spec

      - name: Gate 3 - Validate Standalone Dist Binary Self-Test
        working-directory: pointer_v
        run: |
          dist\PointerV\PointerV.exe --selftest

      - name: Gate 4 - Compile Inno Setup Installer
        working-directory: installers
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PointerV.iss

      - name: Gate 5 - Test Silent Installation & Installed Binary Self-Test
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers/Output/PointerV-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Setup executable not found in installers/Output" }
          $testDir = "$env:TEMP\PointerV_CITest"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$testDir"
          & "$testDir\PointerV.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "Installed binary failed --selftest with exit code $LASTEXITCODE" }
          & "$testDir\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          Start-Sleep -Seconds 2
          Remove-Item -Path $testDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $version = (Get-Content pointer_v/version.py | Select-String '__version__ = "(.*)"').Matches.Groups[1].Value
          Compress-Archive -Path pointer_v/dist/PointerV -DestinationPath "installers/Output/PointerV-Portable-$version.zip" -Force

      - name: Compute Checksums
        working-directory: installers
        shell: pwsh
        run: |
          $installer = Get-ChildItem Output/PointerV-Setup-*.exe | Select-Object -First 1
          $zip = Get-ChildItem Output/PointerV-Portable-*.zip | Select-Object -First 1
          $hash1 = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          $hash2 = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          
          "$hash1  $($installer.Name)" | Out-File -FilePath Output/SHA256SUMS.txt -Encoding utf8
          "$hash2  $($zip.Name)" | Out-File -FilePath Output/SHA256SUMS.txt -Append -Encoding utf8
          
          Get-Content Output/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PointerV-Windows-Artifacts
          path: |
            installers/Output/PointerV-Setup-*.exe
            installers/Output/PointerV-Portable-*.zip
            installers/Output/SHA256SUMS.txt
          if-no-files-found: error
