name: Build and Package Pointer V

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pointer_v/requirements.txt
          pip install pytest

      - name: Run Pytest Suite
        run: |
          pytest tests -v

  build-windows:
    name: Build Windows Executable & Installer
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pointer_v/requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build PyInstaller Onedir Bundle
        working-directory: pointer_v
        run: |
          pyinstaller --clean --noconfirm PointerV.spec

      - name: Create Portable Zip
        working-directory: pointer_v/dist
        run: |
          Compress-Archive -Path PointerV -DestinationPath PointerV-Portable-2.0.0.zip -Force

      - name: Compile Inno Setup Installer
        working-directory: installers
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PointerV.iss

      - name: Compute Checksums
        working-directory: installers
        shell: pwsh
        run: |
          $installer = "Output/PointerV-Setup-2.0.0.exe"
          $zip = "../pointer_v/dist/PointerV-Portable-2.0.0.zip"
          $hash1 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          $hash2 = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          
          "$hash1  PointerV-Setup-2.0.0.exe" | Out-File -FilePath Output/SHA256SUMS.txt -Encoding utf8
          "$hash2  PointerV-Portable-2.0.0.zip" | Out-File -FilePath Output/SHA256SUMS.txt -Append -Encoding utf8
          
          Copy-Item $zip -Destination Output/
          Get-Content Output/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PointerV-Windows-v2.0.0
          path: |
            installers/Output/PointerV-Setup-2.0.0.exe
            installers/Output/PointerV-Portable-2.0.0.zip
            installers/Output/SHA256SUMS.txt
          if-no-files-found: error
